# docker compose up  (run from games/netcode-lab/deploy, or: docker compose -f deploy/docker-compose.yml up)
#   game        http://<host>:8080  (WebSocket)   https://<host>:8443 (WebTransport, one cert click)
#   infra       http://<host>:8091/infra.html  regions, beacons, matchmaker, /duel.html, /metrics  (https 8454)
#   prometheus  http://<host>:9090  (alert rules: deploy/prometheus/alerts.yml)
#   grafana     http://<host>:3000  (anonymous viewer, dashboard "Netcode Lab · regions")
# Host ports can be moved with env vars, e.g. GAME_HTTP_PORT=18730 docker compose up.
name: netcode-lab
services:
  game:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: netcode-lab:local
    command: ["bin/server", "-http", "0.0.0.0:8080", "-https", "0.0.0.0:8443", "-dist", "client/dist"]
    environment:
      - "NETLAB_ADMIN_TOKEN=${NETLAB_ADMIN_TOKEN:-lab}"
    ports:
      - "${GAME_HTTP_PORT:-8080}:8080"
      - "${GAME_HTTPS_PORT:-8443}:8443/tcp"
      - "${GAME_HTTPS_PORT:-8443}:8443/udp"
  infra:
    image: netcode-lab:local
    depends_on: [game]
    command: ["bin/infra", "-http", "0.0.0.0:8091", "-https", "0.0.0.0:8454", "-www", "bin/duel-www"]
    environment:
      - "NETLAB_ADMIN_TOKEN=${NETLAB_ADMIN_TOKEN:-lab}"
    ports:
      - "${INFRA_HTTP_PORT:-8091}:8091"
      - "${INFRA_HTTPS_PORT:-8454}:8454/tcp"
      - "${INFRA_HTTPS_PORT:-8454}:8454/udp"
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports: ["${PROM_PORT:-9090}:9090"]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/netcode-lab.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
