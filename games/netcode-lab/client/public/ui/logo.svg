<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" class="netcode-logo">
  <defs>
    <linearGradient id="logo-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="logo-grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem: Network Node Crosshair (Blue + Orange team polarity) -->
  <g transform="translate(8, 8)">
    <!-- Outer radar ring -->
    <circle cx="24" cy="24" r="22" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Pulse radar arcs -->
    <path d="M 10 24 A 14 14 0 0 1 24 10" fill="none" stroke="url(#logo-grad-blue)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 38 24 A 14 14 0 0 1 24 38" fill="none" stroke="url(#logo-grad-orange)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Central stylized 'N' network packet polygon -->
    <polygon points="17,32 17,16 23,26 25,26 31,16 31,32 27,32 27,22 24.5,27 23.5,27 21,22 21,32" fill="#f8fafc"/>
    
    <!-- Hitscan crosshair reticles -->
    <line x1="24" y1="4" x2="24" y2="9" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="39" x2="24" y2="44" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="24" x2="9" y2="24" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <line x1="39" y1="24" x2="44" y2="24" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Packet dots -->
    <circle cx="24" cy="24" r="2.5" fill="#38bdf8" filter="url(#logo-glow)"/>
  </g>

  <!-- Wordmark Typography -->
  <g transform="translate(66, 12)">
    <!-- Main title: NETCODE -->
    <text x="0" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="1.5">NETCODE</text>
    
    <!-- Accent badge: LAB -->
    <g transform="translate(136, 6)">
      <rect width="56" height="24" rx="5" fill="url(#logo-grad-orange)" filter="url(#logo-glow)"/>
      <text x="28" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="1.5" text-anchor="middle">LAB</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="1" y="42" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" letter-spacing="2.8">BROWSER TEAM SHOOTER</text>
  </g>
</svg>